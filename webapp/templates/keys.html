{% extends "base.html" %}
{% block title %}Ключи · Drebol-bot{% endblock %}
{% block content %}
<header class="page-head">
  <h1>Ключи и API</h1>
  <p>FunPay, Groq, OpenRouter.</p>
</header>

<section class="panel">
  <h2>FunPay</h2>
  <form method="post" action="/keys/funpay" class="form-grid">
    <label>Golden Key
      <div style="position:relative;">
        <input name="gk" id="gk-input" type="password" value="{{ gk }}" autocomplete="off" style="padding-right:40px;">
        <button type="button" onclick="toggleVis('gk-input')" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </label>
    <label>User-Agent
      <div style="position:relative;">
        <input name="ua" id="ua-input" type="password" value="{{ ua }}" autocomplete="off" style="padding-right:40px;">
        <button type="button" onclick="toggleVis('ua-input')" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </label>
    <div style="grid-column:1/-1;">
      <button type="submit">Сохранить FunPay</button>
    </div>
  </form>
</section>

<section class="panel">
  <h2>Groq</h2>
  <form method="post" action="/keys/groq" class="form-grid">
    <label>API Key
      <div style="position:relative;">
        <input name="groq_key" id="groq-input" type="password" value="{{ groq_key }}" autocomplete="off" placeholder="gsk_..." style="padding-right:40px;">
        <button type="button" onclick="toggleVis('groq-input')" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </label>
    <div style="grid-column:1/-1;">
      <button type="submit">Сохранить Groq</button>
    </div>
  </form>
</section>

<section class="panel">
  <h2>OpenRouter</h2>
  <form method="post" action="/keys/openrouter" class="form-grid">
    <label>API Key
      <div style="position:relative;">
        <input name="openrouter_key" id="or-input" type="password" value="{{ openrouter_key }}" autocomplete="off" placeholder="sk-or-..." style="padding-right:40px;">
        <button type="button" onclick="toggleVis('or-input')" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </label>
    <div style="grid-column:1/-1;">
      <button type="submit">Сохранить OpenRouter</button>
    </div>
  </form>
</section>

<script>
function toggleVis(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
